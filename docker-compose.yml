services:
  postgres:
    image: postgres:16
    container_name: horizon-postgres
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon_dev
      POSTGRES_DB: horizon
    ports:
      - "5432:5432"
    volumes:
      - horizon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: horizon-redis
    ports:
      - "6379:6379"
    volumes:
      - horizon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rsshub:
    image: diygod/rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      CACHE_EXPIRE: 600
    depends_on:
      redis:
        condition: service_healthy

volumes:
  horizon_pg_data:
  horizon_redis_data:
