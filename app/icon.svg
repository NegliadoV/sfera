<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradientMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <g stroke-linecap="round">
    <!-- Smallest Arch -->
    <g transform="translate(35, 35) scale(0.3)">
      <path d="M 25 85 L 25 50 A 25 25 0 0 1 75 50 L 75 85" stroke="url(#neonGradientMain)" stroke-width="10" />
    </g>

    <!-- Medium Arch -->
    <g transform="translate(20, 20) scale(0.6)">
      <path d="M 25 85 L 25 50 A 25 25 0 0 1 75 50 L 75 85" stroke="url(#neonGradientMain)" stroke-width="6.5" />
    </g>

    <!-- Large Arch -->
    <g transform="translate(5, 5) scale(0.9)">
      <path d="M 25 85 L 25 50 A 25 25 0 0 1 75 50 L 75 85" stroke="url(#neonGradientMain)" stroke-width="4.5" />
    </g>
  </g>

  <!-- Center Core -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
