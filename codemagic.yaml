workflows:
  ios-sfera:
    name: iOS SFERA workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SFERA/SFERA.xcodeproj"
        XCODE_SCHEME: "SFERA"
    scripts:
      - name: Build iOS app (unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ios
          cp -r build/DerivedData/Build/Products/Release-iphoneos/SFERA.app build/ios/
    artifacts:
      - build/ios/**/*.app

  # React Native (Expo) — install and typecheck. For full EAS build set EXPO_TOKEN and run: cd mobile && npx eas build --platform all --non-interactive
  mobile-rn:
    name: Mobile RN (Expo) check
    max_build_duration: 15
    environment:
      vars:
        EXPO_PUBLIC_API_URL: "https://sfera.example.com"
        EXPO_PUBLIC_WS_URL: "wss://sfera.example.com"
    scripts:
      - name: Install and typecheck
        script: |
          cd mobile
          npm ci
          npx tsc --noEmit
