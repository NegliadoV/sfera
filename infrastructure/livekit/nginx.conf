# Добавьте этот блок server { ... } в ваш Nginx на VPS, чтобы Nginx принимал WSS и HTTPS на ваш домен и перенаправлял в LiveKit

server {
    listen 80;
    server_name rtc.ВАШ_ДОМЕН.com; # Замените на домен для LiveKit!
    
    # Для Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rtc.ВАШ_ДОМЕН.com; # Замените на домен для LiveKit!

    # Сертификаты (Замените после выполнения 'certbot --nginx -d rtc.ВАШ_ДОМЕН.com')
    ssl_certificate /etc/letsencrypt/live/rtc.ВАШ_ДОМЕН.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.ВАШ_ДОМЕН.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880; # Перекидывает на Docker-контейнер LiveKit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # ВАЖНО для WebRTC/WebSockets!
        proxy_set_header Connection "upgrade";  # ВАЖНО для WebRTC/WebSockets!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400; # Соединения живут долго
    }
}
